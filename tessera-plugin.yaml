# Ora (Greek "hour"): a face of the screensaver's clock for Tessera. The hours and the minutes in two boxes as large
# as the glass allows, in colours you pick, with a night colour. Every field: docs/MANIFEST.md of tessera-plugins.
# Words are keys into translations/en.json, part "app".
id: ora
version: 1.0.1
api: '0.27'
icon: clock-outline
maintainer: CooLaToS
license: MIT
stage: beta
topics:
- time
requires:
  esphome: 2026.6.2
boards: any
flash_kb: 6
savers:
- id: ora
  name: saver_name
  icon: clock-outline
  step: clock
  memory: 2200
  example: saver_example
  options:
